<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Stylized Angkor Temple & POS Terminal Symbol -->
  <g filter="url(#shadow512)" transform="translate(96, 85)">
    <!-- Terminal Screen / Outer Frame -->
    <rect x="32" y="40" width="256" height="172" rx="36" fill="#1e293b" stroke="#6366f1" stroke-width="8"/>
    <!-- Screen Display -->
    <rect x="52" y="60" width="216" height="110" rx="20" fill="#0f172a"/>
    <!-- Angkor Spire / Signal Crown -->
    <path d="M 160 8 L 176 44 L 144 44 Z" fill="url(#goldGrad512)"/>
    <path d="M 118 24 L 128 44 L 108 44 Z" fill="url(#goldGrad512)"/>
    <path d="M 202 24 L 212 44 L 192 44 Z" fill="url(#goldGrad512)"/>
    <!-- POS Screen Text -->
    <text x="160" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="48" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">POS</text>
    <circle cx="240" cy="82" r="8" fill="#10b981"/>
    <!-- Stand / Keypad base -->
    <path d="M 96 212 L 118 272 L 202 272 L 224 212 Z" fill="#334155"/>
    <rect x="76" y="268" width="168" height="32" rx="16" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
    <!-- Card Slot Accent -->
    <rect x="112" y="278" width="96" height="8" rx="4" fill="#fbbf24"/>
  </g>
</svg>
