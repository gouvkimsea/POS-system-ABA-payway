<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Stylized Angkor Temple & POS Terminal Symbol -->
  <g filter="url(#shadow)" transform="translate(36, 32)">
    <!-- Terminal Screen / Base -->
    <rect x="12" y="16" width="96" height="64" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="3"/>
    <!-- Screen Glare / Display -->
    <rect x="20" y="24" width="80" height="40" rx="8" fill="#0f172a"/>
    <!-- Angkor Spire / Signal Crown -->
    <path d="M 60 4 L 66 18 L 54 18 Z" fill="url(#goldGrad)"/>
    <path d="M 44 10 L 48 18 L 40 18 Z" fill="url(#goldGrad)"/>
    <path d="M 76 10 L 80 18 L 72 18 Z" fill="url(#goldGrad)"/>
    <!-- POS Screen Text -->
    <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">POS</text>
    <circle cx="90" cy="32" r="3" fill="#10b981"/>
    <!-- Stand / Keypad base -->
    <path d="M 36 80 L 44 102 L 76 102 L 84 80 Z" fill="#334155"/>
    <rect x="28" y="100" width="64" height="12" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- Card Slot Accent -->
    <rect x="42" y="104" width="36" height="3" rx="1.5" fill="#f59e0b"/>
  </g>
</svg>
